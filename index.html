<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="MOSS 결과 공유 룰렛">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; media-src 'self' blob:">
  <title>MOSS Roulette</title>
  <link rel="stylesheet" href="/roulette/roulette.6e568647.css">
</head>
<body>
<script type="module" src="/roulette/roulette.26d76260.js"></script>
<script>
  window.dataLayer = [];
  window.gtag = function () {};

  function getNames() {
    return document.querySelector('#in_names').value.trim().split(/[,\r\n]/g).map(v => v.trim()).filter(Boolean);
  }

  function parseName(nameStr) {
    const weightRegex = /(\/\d+)/;
    const countRegex = /(\*\d+)/;
    const hasWeight = weightRegex.test(nameStr);
    const hasCount = countRegex.test(nameStr);
    const match = /^\s*([^\/*]+)?/.exec(nameStr);
    return {
      name: match ? match[1] : nameStr,
      weight: hasWeight ? parseInt(weightRegex.exec(nameStr)[1].replace('/', '')) : 1,
      count: hasCount ? parseInt(countRegex.exec(nameStr)[1].replace('*', '')) : 1,
    };
  }

  let ready = false;
  let winnerType = 'first';
  let runFinished = false;
  const replayParams = new URLSearchParams(location.search);
  const replayMode = replayParams.has('seed') && replayParams.has('at');

  function applyWinnerSetting(edited) {
    const rankInput = document.querySelector('#in_winningRank');
    const startInput = document.querySelector('#in_rangeStart');
    const endInput = document.querySelector('#in_rangeEnd');
    let start, end;
    if (winnerType === 'first') start = end = 1;
    else if (winnerType === 'last') start = end = window.roulette.getCount();
    else if (winnerType === 'multi') {
      start = parseInt(startInput.value, 10) || 1;
      end = parseInt(endInput.value, 10) || 1;
      if (end < start) edited === 'end' ? start = end : end = start;
    } else start = end = parseInt(rankInput.value, 10) || 1;
    window.roulette.setWinnerRange(start - 1, end - 1);
    const clipped = window.roulette.getWinnerRange();
    if (winnerType === 'multi') {
      startInput.value = clipped.start + 1;
      endInput.value = clipped.end + 1;
    } else rankInput.value = clipped.start + 1;
    document.querySelector('.btn-first-winner').classList.toggle('active', winnerType === 'first');
    document.querySelector('.btn-last-winner').classList.toggle('active', winnerType === 'last');
    document.querySelector('.btn-multi-winner').classList.toggle('active', winnerType === 'multi');
    rankInput.classList.toggle('active', winnerType === 'custom');
    document.querySelector('.row-range').classList.toggle('active', winnerType === 'multi');
  }

  function selectWinnerType(type, edited) {
    if (replayMode) return;
    winnerType = type;
    applyWinnerSetting(edited);
  }

  function getReady() {
    const names = getNames();
    window.roulette.setMarbles(names);
    ready = names.length > 0;
    if (!replayMode) localStorage.setItem('moss_roulette_names', names.join(','));
    applyWinnerSetting();
  }

  function lockReplayUi() {
    document.querySelector('#settings').classList.add('hide');
    document.querySelector('#in_names').readOnly = true;
    document.querySelectorAll('#settings input, #settings select, #settings textarea, #settings button').forEach(el => el.disabled = true);
    const badge = document.createElement('div');
    badge.textContent = '공유된 결과 재생 · 설정 변경 불가';
    Object.assign(badge.style, {position:'fixed',top:'10px',left:'50%',transform:'translateX(-50%)',zIndex:'10000',padding:'8px 14px',borderRadius:'999px',background:'rgba(0,0,0,.75)',color:'#fff',font:'13px sans-serif'});
    document.body.appendChild(badge);
  }

  function initialize() {
    if (!window.roulette || !window.roulette.isReady) return setTimeout(initialize, 100);

    const namesFromUrl = replayParams.get('names');
    if (namesFromUrl) document.querySelector('#in_names').value = namesFromUrl.replace(/,/g, '\n');
    else if (!replayMode) {
      const saved = localStorage.getItem('moss_roulette_names');
      if (saved) document.querySelector('#in_names').value = saved;
    }

    document.querySelector('#in_names').addEventListener('input', () => { if (!replayMode) getReady(); });
    document.querySelector('#btnShuffle').addEventListener('click', () => { if (!replayMode) getReady(); });
    document.querySelector('#chkAutoRecording').addEventListener('change', e => { if (!replayMode) window.roulette.setAutoRecording(e.target.checked); });
    document.querySelector('#chkSkill').addEventListener('change', e => { window.options.useSkills = e.target.checked; });
    document.querySelector('#chkDarkMode').addEventListener('change', e => { if (!replayMode) { window.roulette.setTheme(e.target.checked ? 'dark' : 'light'); document.documentElement.classList.toggle('light', !e.target.checked); } });
    document.querySelector('#in_winningRank').addEventListener('change', () => selectWinnerType('custom'));
    document.querySelector('.btn-last-winner').addEventListener('click', () => selectWinnerType('last'));
    document.querySelector('.btn-first-winner').addEventListener('click', () => selectWinnerType('first'));
    document.querySelector('.btn-multi-winner').addEventListener('click', () => selectWinnerType('multi'));
    document.querySelector('#in_rangeStart').addEventListener('change', () => selectWinnerType('multi', 'start'));
    document.querySelector('#in_rangeEnd').addEventListener('change', () => selectWinnerType('multi', 'end'));

    const maps = window.roulette.getMaps();
    const mapSelector = document.querySelector('#sltMap');
    maps.forEach((map, idx) => {
      const option = document.createElement('option');
      option.value = map.index;
      option.textContent = `맵 ${idx + 1}`;
      mapSelector.append(option);
    });
    mapSelector.addEventListener('change', e => { if (!replayMode) { window.roulette.setMap(e.target.value); getReady(); } });

    const toggleBtn = document.querySelector('#btnToggleSettings');
    const collapsible = document.querySelector('.collapsible-rows');
    toggleBtn.addEventListener('click', () => {
      if (replayMode) return;
      collapsible.classList.toggle('collapsed');
      toggleBtn.querySelector('.toggle-arrow').textContent = collapsible.classList.contains('collapsed') ? '▲' : '▼';
    });

    const startBtn = document.querySelector('#btnStart');
    startBtn.addEventListener('click', () => {
      if (!ready || replayMode) return;
      runFinished = false;
      const share = document.querySelector('#btnShareReplay');
      if (share) { share.disabled = true; share.title = '룰렛 결과가 나온 뒤 공유할 수 있습니다'; }
      document.querySelector('#settings').classList.add('hide');
      window.roulette.start();
    });

    window.roulette.addEventListener('goal', () => {
      ready = false;
      runFinished = true;
      if (replayMode) return;
      const share = document.querySelector('#btnShareReplay');
      if (share) { share.disabled = false; share.title = '방금 실행한 과정과 결과 공유'; }
      setTimeout(() => document.querySelector('#settings').classList.remove('hide'), 1500);
    });

    getReady();

    const shareWait = () => {
      const share = document.querySelector('#btnShareReplay');
      if (!share) return setTimeout(shareWait, 100);
      if (!replayMode) {
        share.disabled = true;
        share.title = '룰렛 결과가 나온 뒤 공유할 수 있습니다';
        share.addEventListener('click', e => {
          if (!runFinished) { e.preventDefault(); e.stopImmediatePropagation(); alert('룰렛 실행이 끝난 뒤 결과 링크를 만들 수 있습니다.'); }
        }, true);
      } else {
        share.remove();
        lockReplayUi();
        setTimeout(() => {
          // 공유 링크는 설정 화면 없이 기록된 조건으로 한 번만 자동 실행한다.
          window.roulette.start();
        }, 300);
      }
    };
    shareWait();
  }

  document.addEventListener('DOMContentLoaded', initialize);
</script>

<h1 class="sr-only">MOSS Roulette</h1>
<div id="settings" class="settings">
  <div class="right">
    <button id="btnToggleSettings" class="btn-toggle-settings"><span>설정</span><i class="toggle-arrow">▲</i></button>
    <div class="collapsible-rows collapsed">
      <div class="row"><label for="sltMap"><i class="icon map"></i><span>맵</span></label><select id="sltMap"></select></div>
      <div class="row row-toggles">
        <div class="toggle-item"><label for="chkAutoRecording"><i class="icon record"></i><span>녹화</span></label><input type="checkbox" id="chkAutoRecording"></div>
        <div class="toggle-item"><label for="chkSkill"><i class="bomb icon"></i><span>스킬</span></label><input type="checkbox" id="chkSkill" checked></div>
      </div>
      <div class="row"><label><i class="icon trophy"></i><span>당첨 순위</span></label><div class="btn-group"><button class="active btn-first-winner btn-winner">첫번째</button><button class="btn-last-winner btn-winner">마지막</button><input type="number" id="in_winningRank" value="1" min="1"><button class="btn-multi-winner btn-winner">여러명</button></div></div>
      <div class="row row-range"><label></label><div class="btn-group range-group"><input type="number" id="in_rangeStart" value="1" min="1"><span class="range-sep">~</span><input type="number" id="in_rangeEnd" value="3" min="1"></div></div>
      <div class="row row-theme"><div class="theme"><i class="icon sun"></i><input type="checkbox" id="chkDarkMode" checked><i class="icon moon"></i></div></div>
    </div>
  </div>
  <div class="left">
    <h3>참가자 이름</h3>
    <textarea id="in_names" placeholder="쉼표 또는 줄바꿈으로 이름을 구분하세요">수박*2,키위*2,귤*2</textarea>
    <div class="actions"><div class="sep"></div><button id="btnShuffle"><i class="icon shuffle"></i><span>섞기</span></button><button id="btnStart"><i class="icon play"></i><span>시작</span></button></div>
  </div>
</div>
</body>
</html>
